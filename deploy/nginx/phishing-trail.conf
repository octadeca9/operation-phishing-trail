# Operation: Phishing Trail — contoh Nginx reverse proxy (subdomain).
# Sesuaikan server_name, sertifikat, DNS, dan upstream dengan lingkungan nyata.
#
# Topologi A (Nginx di host): upstream -> 127.0.0.1:18080 (port loopback Compose).
# Topologi B (Nginx di Docker): ganti upstream ke nama service "phishing-trail:8080"
#                               dan hapus publish port di compose.yaml.

upstream phishing_trail_upstream {
    server 127.0.0.1:18080;
    keepalive 16;
}

server {
    listen 80;
    server_name phishing-trail.hack.redlimit.id;

    # Redirect ke HTTPS (atau dikelola oleh TLS manager standar server).
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name phishing-trail.hack.redlimit.id;

    # Isi sesuai sistem pengelolaan TLS server.
    ssl_certificate     /etc/letsencrypt/live/phishing-trail.hack.redlimit.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/phishing-trail.hack.redlimit.id/privkey.pem;

    server_tokens off;
    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Rate limit awal di edge (lengkapi dengan limit_req_zone di http{}).
    # limit_req zone=phishing_submit burst=10 nodelay;

    location / {
        proxy_pass http://phishing_trail_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Health check internal: batasi akses bila perlu.
    location = /healthz {
        proxy_pass http://phishing_trail_upstream;
        access_log off;
    }
}
